<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de pacientes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-container">
        <header>
            <h1>Cadastrar pacientes</h1>
            <p>Adicione informações básicas para cadastrar o paciente em sua clínica</p>
        </header>
        <form id="form-cadastro">
            <div class = "input-group">
                <label for = "nome_completo">Nome completo:</label>
                <input type="text" id="nome_completo" required placeholder="Nome completo do paciente">
            </div>

            <div class = "input-group">
                <label for = "data_nascimento"> Data de nascimento: </label>
                <input
                    type="text"
                    id="data_nascimento"
                    required
                    placeholder="DD/MM/AAAA"
                    pattern="\d{2}/\d{2}/\d{4}"
                    title="Digite a data no formato DD/MM/AAAA"
                >
            </div>

            <div class = "input-group">
                <label for = "cpf">CPF:</label>
                <input type = "text" id="cpf" required placeholder="000.000.000-00">
            </div>

            <div class = "input-group">
                <label for = "telefone">Telefone:</label>
                <input type = "tel" id="telefone" required placeholder="(00) 00000-0000">
            </div>

            <div class = "input-group">
                <label for = "email">E-mail:</label>
                <input type = "email" id="email" required placeholder="emaildopaciente@gmail.com">
            </div>

            <div class = "input-group">
                <label for = "observacoes">Observações:</label>
                <textarea id="observacoes" placeholder="Adicione aqui qualquer observação relevante sobre o paciente"></textarea>
            </div>

            <button type="submit">Cadastrar</button>
        </form>

        <a href="lista.html" class="link-botao">Ver pacientes cadastrados</a>

    </div>

    <script src="script.js"></script>

</body>
</html>
